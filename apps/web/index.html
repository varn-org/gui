<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Varn GUI Gallery</title>
    <style>
        :root {
            --safe-area-top: env(safe-area-inset-top, 0px);
            --safe-area-right: env(safe-area-inset-right, 0px);
            --safe-area-bottom: env(safe-area-inset-bottom, 0px);
            --safe-area-left: env(safe-area-inset-left, 0px);
        }

        html, body { margin: 0; height: 100%; }
        body { font: 15px/1.35 system-ui, sans-serif; }

        /* The engine sends finished frames, so the surface is the only thing that positions anything. */
        #surface { position: relative; width: 100%; height: 100%; overflow: hidden; }
        #surface * { position: absolute; box-sizing: border-box; }
    </style>
</head>
<body>
    <div id="surface"></div>
    <script type="module" src="./main.js"></script>
</body>
</html>
